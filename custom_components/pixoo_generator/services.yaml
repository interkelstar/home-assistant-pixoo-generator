generate:
  name: Create animation
  description: Generate a new animation and optionally display it. Returns a background job ID; queued is not delivered. Uses paid provider API credits.
  fields:
    entry_id:
      name: Frame
      description: Optional when exactly one Pixoo Animation instance is configured.
      selector:
        config_entry:
          integration: pixoo_generator
    text:
      name: Scene
      required: true
      selector:
        text:
          multiline: true
    style:
      name: Style
      selector:
        text:
    display:
      name: Display when ready
      default: true
      selector:
        boolean:
    notify:
      name: Allow completion notifications
      description: Included in the completion event for your optional notification automation.
      default: true
      selector:
        boolean:
show:
  name: Show saved animation
  description: Send a saved animation to its frame without a new generation charge.
  fields:
    entry_id:
      name: Frame
      selector:
        config_entry:
          integration: pixoo_generator
    job_id:
      description: Optional; uses the selected gallery item when omitted.
      selector:
        text:
    notify:
      default: true
      selector:
        boolean:
delete:
  name: Delete saved animation
  description: Delete a job and its files. Uses the selected gallery item if job_id is omitted.
  fields:
    entry_id:
      name: Frame
      selector:
        config_entry:
          integration: pixoo_generator
    job_id:
      selector:
        text:
list_animations:
  name: List saved animations
  description: Read descriptions, creation dates, favorites and the last confirmed displayed animation. No generation, display or billing. Local dates use Home Assistant's timezone.
  fields:
    entry_id:
      name: Frame
      selector:
        config_entry:
          integration: pixoo_generator
favorite:
  name: Keep an animation as a favorite
  description: Favorites are protected from automatic history cleanup. Without job_id, uses the last confirmed displayed animation, not an unshown gallery preview. Removing the favorite subjects it to normal retention again. Explicit deletion still removes favorites.
  fields:
    entry_id:
      name: Frame
      selector:
        config_entry:
          integration: pixoo_generator
    job_id:
      selector:
        text:
    favorite:
      default: true
      selector:
        boolean:
